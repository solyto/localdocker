server {
    listen 8000;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 50M;

    error_page 413 @error_413;
    error_page 502 @error_502;
    error_page 503 @error_503;
    error_page 504 @error_504;

    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|pdf|doc|docx|zip)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # nginx's own error responses carry CORS headers so the frontend can read the status code
    location @error_413 {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 413 '{"message":"Payload too large"}';
    }

    location @error_502 {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 502 '{"message":"Bad gateway"}';
    }

    location @error_503 {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 503 '{"message":"Service unavailable"}';
    }

    location @error_504 {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 504 '{"message":"Gateway timeout"}';
    }
}
